tags:
  - Contacts
summary: Create new contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
          - userId
        properties:
          _id:
            description: "Contact's id"
            type: string
            example: 65e4decdd286b30065d54af9
          name:
            description: "Contact's name"
            type: string
            example: Katy Perry
          phoneNumber:
            description: "Contact's number"
            type: string
            example: +380 67 123 45 67
          email:
            description: "Contact's email"
            type: string
            example: lizkasheva26@gmail.com
          isFavourite:
            description: 'Is the contact marked as favourite'
            type: boolean
            example: true
          contactType:
            description: "Contact's type"
            type: string
            enum: ['home', 'work', 'personal']
          photo:
            description: "Link to Contact's photo"
            type: string
            format: binary
            example: 'https://www.example.com/photo.jpg'
          userId:
            description: 'Id of the user who owns this contact'
            type: string
            example: 65e4decdd286b30065d54af9
responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              $ref: '../../components/schemas/contact.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
